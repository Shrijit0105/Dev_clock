name: Deploy Dev Clock

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/dev-clock.svg"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOCK_TIMEZONE: Asia/Kolkata
      CLOCK_STYLE: cyber

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate settings and generate configuration
        run: |
          mkdir -p public

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

          timezone = os.environ["CLOCK_TIMEZONE"]
          style = os.environ["CLOCK_STYLE"]

          try:
              ZoneInfo(timezone)
          except (ZoneInfoNotFoundError, ValueError):
              raise SystemExit(f"Invalid timezone: {timezone}")

          if style not in {"cyber", "minimal"}:
              raise SystemExit(f"Invalid clock style: {style}")

          config = {
              "timezone": timezone,
              "style": style
          }

          Path("public/config.json").write_text(
              json.dumps(config, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(config, indent=2))
          PY

      - name: Verify website entry point
        run: |
          test -f public/index.html || {
            echo "ERROR: public/index.html is missing."
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
