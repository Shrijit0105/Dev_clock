name: Update Developer Clock SVG

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/dev-clock.svg"

permissions:
  contents: write

concurrency:
  group: update-clock-svg
  cancel-in-progress: true

jobs:
  update-clock:
    runs-on: ubuntu-latest

    env:
      CLOCK_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate clock SVG
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import html
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          timezone = os.environ["CLOCK_TIMEZONE"]
          now = datetime.now(ZoneInfo(timezone))

          time_text = now.strftime("%H:%M:%S")
          date_text = now.strftime("%A, %d %B %Y")
          zone_text = now.tzname() or timezone

          # Escape text before inserting it into SVG markup.
          time_text = html.escape(time_text)
          date_text = html.escape(date_text)
          zone_text = html.escape(zone_text)
          timezone_text = html.escape(timezone)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="800" height="230" viewBox="0 0 800 230"
            role="img" aria-labelledby="title desc">
            <title id="title">Developer Clock</title>
            <desc id="desc">Last generated at {time_text},
            {date_text}, timezone {timezone_text}.</desc>

            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#101f32"/>
                <stop offset="100%" stop-color="#070c16"/>
              </linearGradient>
              <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#52f7c8"/>
                <stop offset="100%" stop-color="#398bff"/>
              </linearGradient>
            </defs>

            <rect x="1" y="1" width="798" height="228" rx="16"
              fill="url(#bg)" stroke="#244357" stroke-width="1.5"/>

            <path d="M24 52 H776" stroke="#244357" stroke-width="1"/>
            <path d="M24 53 H185" stroke="url(#line)" stroke-width="2"/>

            <circle cx="28" cy="28" r="4" fill="#52f7c8"/>
            <text x="42" y="32" fill="#b4cbd6" font-size="12"
              font-family="monospace" letter-spacing="2">
              DEV CLOCK / SYSTEM TIME
            </text>
            <text x="773" y="32" text-anchor="end" fill="#52f7c8"
              font-size="11" font-family="monospace">
              ● SNAPSHOT
            </text>

            <text x="30" y="133" fill="#52f7c8"
              font-size="68" font-weight="700"
              font-family="monospace" letter-spacing="-3">
              {time_text}
            </text>

            <text x="33" y="163" fill="#d8e8f0"
              font-size="15" font-family="monospace">
              {date_text}
            </text>

            <path d="M30 184 H770" stroke="#244357" stroke-width="1"/>

            <text x="30" y="207" fill="#819eae"
              font-size="11" font-family="monospace">
              REGION: {timezone_text}
            </text>
            <text x="770" y="207" text-anchor="end" fill="#52f7c8"
              font-size="11" font-family="monospace">
              ZONE: {zone_text}
            </text>
          </svg>
          '''

          Path("assets/dev-clock.svg").write_text(svg, encoding="utf-8")
          print(f"Generated clock for {timezone} at {now.isoformat()}")
          PY
    
      - name: Commit and push updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dev-clock.svg

          if git diff --cached --quiet; then
            echo "Clock SVG has no changes."
            exit 0
          fi

          git commit -m "chore: refresh developer clock SVG"

          # Integrate any commits added to GitHub since checkout.
          git fetch origin main
          git rebase origin/main

          # Push the updated branch.
          git push origin HEAD:main
